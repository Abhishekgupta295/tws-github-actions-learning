name: AWS OIDC Challenge
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::324634181198:role/github-oidc-challenge-role
          aws-region: ap-south-1

      - name: Debug GitHub OIDC Claims
        uses: github/actions-oidc-debugger@v1    
      - run: aws sts get-caller-identity
      - run: aws s3 ls
      
