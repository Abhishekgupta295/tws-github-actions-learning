# useed trivy to scan the image for cves
name : Image Scanner

on : 
    workflow_call:

jobs:
    iamge-scan:
        runs-on: ubuntu-latest
        steps:
             
             - name: checking out the code
               uses : actions/checkout@v7

             - name : Login to Docker Hub
               uses : docker/login-action@v3
               with :
                username : ${{ vars.DOCKERHUB_USERNAME }}
                password : ${{ secrets.DOCKERHUB_TOKEN }}

             -  name: Run Trivy vulnerability scanner
                uses: aquasecurity/trivy-action@v0.36.0
                with :  
                     image-ref: ${{ vars.DOCKERHUB_USERNAME }}/github-actions-app:${{ github.sha }}
                     severity: 'CRITICAL' # incase of critical vul we need change images
                     exit-code: '1'
                     trivyignores: ${{ github.workspace }}/.trivyignore