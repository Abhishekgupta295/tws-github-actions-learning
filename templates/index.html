<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Actions</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #0d1117,
                #161b22,
                #21262d
            );

            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            color: #e6edf3;
        }

        .container {
            width: 90%;
            max-width: 750px;
            text-align: center;
            padding: 2.5rem;
        }

        h1 {
            font-size: 2.7rem;
            margin-bottom: 0.7rem;

            background: linear-gradient(
                90deg,
                #58a6ff,
                #a371f7
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;

            padding: 0.45rem 1.2rem;
            margin-bottom: 2.2rem;

            border: 1px solid #30363d;
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.04);

            color: #58a6ff;

            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .cards {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 180px;

            padding: 1.6rem 1.4rem;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 14px;

            transition: transform 0.25s ease,
                        border-color 0.25s ease,
                        background 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);

            border-color: #58a6ff;

            background: rgba(88, 166, 255, 0.08);
        }

        .card span {
            display: block;

            font-size: 0.75rem;

            text-transform: uppercase;

            letter-spacing: 0.1em;

            color: #8b949e;

            margin-bottom: 0.5rem;
        }

        .card strong {
            font-size: 1.2rem;

            color: #f0f6fc;
        }

        .footer {
            margin-top: 2rem;

            font-size: 0.8rem;

            color: #6e7681;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GitHub Actions</h1>

        <p class="subtitle">
            Learning CI/CD through automation
        </p>

        <div class="badge">
            Continuous Integration & Deployment
        </div>

        <div class="cards">

            <div class="card">
                <span>Workflow</span>
                <strong>GitHub Actions</strong>
            </div>

            <div class="card">
                <span>Trigger</span>
                <strong>Push to Main</strong>
            </div>

            <div class="card">
                <span>Runner</span>
                <strong>Ubuntu Latest</strong>
            </div>

        </div>

        <div class="footer">
            Automate • Test • Deploy
        </div>

    </div>

</body>
</html>
